[project]
name = "jarvis-data"
version = "0.1.0"
description = "Personal data pipeline — Apple ecosystem life-log collection and analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# _GUIDE.md 의 코드블록은 "이렇게 하면 안 된다"를 보여주는 예시다.
# ruff 0.16 부터 마크다운 코드블록도 포맷 대상이라 명시적으로 뺀다.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
