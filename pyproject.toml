[project]
name = "jarvis-data"
version = "0.1.0"
description = "자비스 — 개인 데이터를 모아 먼저 말을 거는 로컬 AI 에이전트"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 웹에서 찾은 파일 읽기(PDF, 한글 HWP) — brain/files.py
    # 6.21 부터 한 스트림의 토큰 수에 상한이 있다 — 30쪽이 한 스트림을 나눠 쓰는 15KB PDF 를
    # 6.21.0 은 1.8초에 거절, 6.20.0 은 150초가 넘어도 못 끝냈다(재리뷰 뒤 실측). crypto = AES 로
    # 잠근 빈 암호 PDF(서버에 cryptography 가 없어 못 열었다).
    "pypdf[crypto]>=6.21",
    "olefile>=0.47",
    # 대화가 다루는 헤드리스 크롬 — brain/browser.py. 크롬은 따로 받는다(SETUP 의 브라우저).
    "playwright>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# _GUIDE.md 의 코드블록은 "이렇게 하면 안 된다"를 보여주는 예시다.
# ruff 0.16 부터 마크다운 코드블록도 포맷 대상이라 명시적으로 뺀다.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
