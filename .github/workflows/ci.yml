name: CI

on:
  push:
    branches: [main]
  # 브랜치를 한정하지 않는다. 한정하면 PR 위에 쌓은 PR(stacked PR)이
  # CI를 못 받고 지나간다.
  pull_request:

jobs:
  # "완료"의 정의는 하나여야 한다. harness all 이 ruff·mypy·pytest·GC·Doc Lint 를
  # 전부 돌리므로, CI 가 따로 셋을 돌리면 판정이 두 개가 되고 반드시 갈라진다.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/harness.py all --gc
